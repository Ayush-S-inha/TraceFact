[package]
name = "tracefact"
version = "0.1.0"
edition = "2021"
description = "A local tool for observing and comparing application runtime behavior."
license = "Apache-2.0"
repository = "https://github.com/Ayush-S-inha/TraceFact"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
